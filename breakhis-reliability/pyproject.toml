[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breakhis-reliability"
version = "0.1.0"
description = "Honest evaluation of breast cancer histopathology models: patient leakage, magnification shift, calibration and safe abstention."
authors = [{ name = "Deepak Singh Kekengbam" }]
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "pillow"]

[project.optional-dependencies]
train = ["torch", "torchvision"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
